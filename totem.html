<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Ginásio KOSMO - Ecrã Totem Gigante</title>
  <style>
    body { background: #0b0e11; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; box-sizing: border-box; text-align: center; overflow: hidden; }
    .logo-oval { width: 340px; height: 180px; object-fit: cover; border-radius: 50% / 50%; border: 5px solid #ffd43b; background: #fff; padding: 4px; box-shadow: 0 0 40px rgba(255,212,59,0.6); margin: 0 auto; display: block; }
    .badge { padding: 25px 80px; border-radius: 16px; font-size: 3.5rem; font-weight: 900; color: #fff; display: inline-block; margin-top: 25px; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  </style>
</head>
<body>
  <div style="width:100%; display:flex; flex-direction:column; align-items:center; border-bottom:3px solid #222; padding-bottom:15px; position:relative;">
    <div style="position:absolute; left:0; top:0; font-size: 3.5rem; font-family: monospace; color: #ffd43b; font-weight: 900;" id="totem-relogio">00:00:00</div>
    <img src="logo.jpg" alt="KOSMO" class="logo-oval" onerror="this.src='src/img/logo.jpg';">
    <div id="totem-data" style="font-size: 1.5rem; color: #aaa; font-weight: bold; margin-top: 6px;">Segunda-feira, 6 de Outubro de 2026</div>
  </div>
  
  <div id="totem-corpo" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 style="color:#ffd43b; font-size:4.8rem; margin:15px 0; font-weight:900;">Aproxime o seu Cartão / Código</h1>
    <p style="font-size:2.4rem; color:#ddd; font-style:italic; max-width:1100px; font-weight:700; line-height:1.4;">"Moldar o seu corpo ao seu estilo através de uma forma correta e saudável"</p>
  </div>

  <input type="text" id="totem-hidden-input" autofocus style="position:absolute; opacity:0; pointer-events:none;" onkeydown="onTotemScan(event)">

  <div style="color:#777; font-size:1.3rem; text-align:center; font-weight:bold;">Ginásio KOSMO • Terra Branca, Frente Escola Amor De Deus • NIF: 283023805</div>

  <script>
    let resetTimer = null;
    window.addEventListener('click', () => { document.getElementById('totem-hidden-input').focus(); });
    setInterval(() => { document.getElementById('totem-hidden-input').focus(); }, 1000);

    function falarVozAlta(texto) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-PT';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function voltarEcraInicial() {
      document.getElementById('totem-corpo').innerHTML = `
        <h1 style="color:#ffd43b; font-size:4.8rem; margin:15px 0; font-weight:900;">Aproxime o seu Cartão / Código</h1>
        <p style="font-size:2.4rem; color:#ddd; font-style:italic; max-width:1100px; font-weight:700; line-height:1.4;">"Moldar o seu corpo ao seu estilo através de uma forma correta e saudável"</p>
      `;
    }

    function onTotemScan(e) {
      if (e.key === 'Enter') {
        const code = e.target.value.trim();
        e.target.value = '';
        if (!code) return;

        let members = JSON.parse(localStorage.getItem('kosmo_members')) || [];
        const m = members.find(x => x.barcode === code);
        const now = new Date();
        let ativo = false;
        let nomeCompleto = 'Membro Desconhecido';
        let planoMembro = 'Geral';
        let dataPagamentoStr = '---';
        let dataRenovacaoStr = '---';

        if (m) {
          nomeCompleto = m.name;
          planoMembro = m.plan;
          const dtPag = new Date(m.date || '2026-01-01');
          const dtRen = new Date(dtPag);
          dtRen.setDate(dtRen.getDate() + 30);
          dataPagamentoStr = dtPag.toLocaleDateString('pt-PT');
          dataRenovacaoStr = dtRen.toLocaleDateString('pt-PT');
          ativo = dtRen >= now && m.estado === 'Ativo';
        }

        if (resetTimer) clearTimeout(resetTimer);
        const bgCol = ativo ? '#2b8a3e' : '#c92a2a';
        const msgVoz = ativo ? "Mensalidade ativa, tenha um bom treino!" : "Mensalidade inativa, você não pode treinar!";
        falarVozAlta(msgVoz);

        document.getElementById('totem-corpo').innerHTML = `
          <h1 style="color:${bgCol}; font-size:5rem; margin:10px 0; font-weight:900;">${nomeCompleto}</h1>
          <p style="font-size:2rem; font-weight:bold; margin-bottom:10px;">Plano: ${planoMembro}</p>
          <p style="font-size:1.5rem; color:#bbb; margin-bottom:15px;">Último Pagamento: ${dataPagamentoStr} | Próxima Renovação: ${dataRenovacaoStr}</p>
          <div class="badge" style="background:${bgCol};">${ativo ? 'ACESSO PERMITIDO' : 'ACESSO NEGADO'}</div>
        `;
        resetTimer = setTimeout(() => { voltarEcraInicial(); }, 300000);
      }
    }

    window.addEventListener('storage', (event) => {
      if (event.key === 'kosmo_totem_scan') {
        try {
          const d = JSON.parse(event.newValue);
          if (d) {
            if (resetTimer) clearTimeout(resetTimer);
            const bgCol = d.auth ? '#2b8a3e' : '#c92a2a';
            falarVozAlta(d.auth ? "Mensalidade ativa, tenha um bom treino!" : "Mensalidade inativa, você não pode treinar!");
            document.getElementById('totem-corpo').innerHTML = `
              <h1 style="color:${bgCol}; font-size:5rem; margin:10px 0; font-weight:900;">${d.name}</h1>
              <p style="font-size:2rem; font-weight:bold; margin-bottom:15px;">Plano: ${d.plan}</p>
              <div class="badge" style="background:${bgCol};">${d.auth ? 'ACESSO PERMITIDO' : 'ACESSO NEGADO'}</div>
            `;
            resetTimer = setTimeout(() => { voltarEcraInicial(); }, 300000);
          }
        } catch(e) {}
      }
    });

    setInterval(() => {
      const now = new Date();
      document.getElementById('totem-relogio').innerText = now.toLocaleTimeString('pt-PT');
      const opcoesData = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('totem-data').innerText = now.toLocaleDateString('pt-PT', opcoesData);
    }, 1000);
  </script>
</body>
</html>
