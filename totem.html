<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary: #c92a2a; --bg: #030405; --card: #0d1114; --success: #2b8a3e; --danger: #d9480f; --text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { width: 100vw; height: 100vh; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px; overflow: hidden; text-align: center; }

    .totem-top-info { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; margin-top: 5px; }
    #clock-date { font-size: 2.2rem; color: #ced4da; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    #clock-time { font-size: 8rem; color: #ffd43b; font-weight: 900; letter-spacing: 6px; line-height: 1; text-shadow: 0 0 40px rgba(255,212,59,0.4), 0 5px 25px rgba(0,0,0,0.9); }

    .totem-center-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; width: 100%; max-width: 1200px; flex: 1; }
    
    .totem-logo-gigante { 
      width: 750px; 
      height: 380px; 
      object-fit: cover; 
      border-radius: 50%;
      border: 5px solid var(--primary);
      box-shadow: 0 0 35px rgba(201,42,42,0.8);
      background: #c2d4e8;
      margin: -10px 0;
    }

    .totem-input { width: 100%; max-width: 600px; padding: 16px; font-size: 1.5rem; font-weight: bold; border-radius: 8px; border: 3px solid var(--primary); background: #fff; color: #212529; text-align: center; outline: none; box-shadow: 0 5px 20px rgba(0,0,0,0.6); }
    .totem-input:focus { border-color: #ff6b6b; }

    .totem-result { width: 100%; max-width: 800px; min-height: 130px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; padding: 15px; background: var(--card); border: 3px solid #21262d; transition: all 0.2s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    .totem-result.success { background: rgba(43, 138, 62, 0.3); border: 4px solid var(--success); }
    .totem-result.error { background: rgba(217, 72, 15, 0.3); border: 4px solid var(--danger); }
    
    .totem-result h2 { font-size: 2rem; margin-bottom: 4px; font-weight: 900; letter-spacing: 1px; }
    .totem-result p { font-size: 1.2rem; color: #e9ecef; font-weight: 600; }
    
    .totem-footer { font-size: 0.85rem; color: #6c757d; display: flex; flex-direction: column; gap: 2px; margin-bottom: 5px; }
    .wake-status { color: #2b8a3e; font-weight: bold; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="totem-top-info">
    <span id="clock-date">CARREGANDO...</span>
    <span id="clock-time">00:00:00</span>
  </div>

  <div class="totem-center-stage">
    <img src="logo.jpg" alt="Ginásio KOSMO" class="totem-logo-gigante" onerror="this.src='src/img/logo.jpg';">
    
    <input type="text" id="totem-code-input" class="totem-input" placeholder="PASSE O CARTÃO NO LEITOR..." autofocus autocomplete="off">
    
    <div id="totem-result-box" class="totem-result">
      <h2>PRONTO PARA LEITURA</h2>
      <p>Aproxime o cartão de membro ou código de barras</p>
    </div>
  </div>

  <div class="totem-footer">
    <span>Ginásio KOSMO | Terra Branca, Frente Escola Amor De Deus | NIF: 283023805</span>
    <span id="wake-lock-label" class="wake-status">⚡ Sistema Antihibernação & Foco Automático Ativo</span>
  </div>

  <script>
    const SUPABASE_URL = 'https://htyhbtbayxreoundolac.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2Fy-0tjG0UszGVLoHnBdOQ_OtNFPQfY';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('wake-lock-label').innerText = "⚡ Monitor Protegido contra Suspensão (Ativo 24/7)";
        }
      } catch (err) { console.error(err); }
    }

    window.addEventListener('load', () => {
      requestWakeLock();
      setInterval(requestWakeLock, 20000);
      focarInputImediato();
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
        focarInputImediato();
      }
    });

    function focarInputImediato() {
      const inp = document.getElementById('totem-code-input');
      if (inp) inp.focus();
    }

    window.addEventListener('blur', () => { setTimeout(focarInputImediato, 100); });
    document.addEventListener('click', focarInputImediato);
    setInterval(focarInputImediato, 1000);

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock-date').innerText = now.toLocaleDateString('pt-PT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('clock-time').innerText = now.toLocaleTimeString('pt-PT');
    }, 1000);

    const inputField = document.getElementById('totem-code-input');
    inputField.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const code = inputField.value.trim();
        if (code) {
          processarCheckinTotem(code);
        }
        inputField.value = '';
      }
    });

    async function processarCheckinTotem(code) {
      const now = new Date();
      const resBox = document.getElementById('totem-result-box');
      let m = null;

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('kosmo_membros')
            .select('id, name, nif, phone, barcode, plan')
            .eq('barcode', code)
            .single();
          if (!error && data) m = data;
        } catch (err) {
          console.log('Erro ao consultar Supabase');
        }
      }

      if (!m) {
        let members = JSON.parse(localStorage.getItem('kosmo_members')) || [];
        m = members.find(x => x.barcode === code);
      }

      if (m) {
        resBox.className = 'totem-result success';
        resBox.innerHTML = `<h2>✅ ACESSO AUTORIZADO</h2><p style="font-size:1.5rem; color:#fff;">Bem-vindo(a), <strong>${m.name}</strong></p><p style="margin-top:2px; font-size:1rem; color:#d3f9d8;">Plano: ${m.plan || 'Normal'}</p>`;

        let attendanceLogs = JSON.parse(localStorage.getItem('kosmo_attendance')) || [];
        attendanceLogs.unshift({ data: now.toLocaleDateString('pt-PT'), time: now.toLocaleTimeString('pt-PT'), name: m.name, barcode: code, status: 'Ativo' });
        localStorage.setItem('kosmo_attendance', JSON.stringify(attendanceLogs));

        if (supabaseClient) {
          supabaseClient.from('kosmo_pagamentos').insert([{ data: now.toISOString(), Membro: m.name, Código: code, Estado: 'Check-in' }]).then(()=>{});
        }

      } else {
        resBox.className = 'totem-result error';
        resBox.innerHTML = `<h2>❌ CARTÃO DESCONHECIDO</h2><p style="font-size:1.3rem;">O código <code>${code}</code> não está registado.</p>`;
      }

      setTimeout(() => {
        resBox.className = 'totem-result';
        resBox.innerHTML = `<h2>PRONTO PARA LEITURA</h2><p>Aproxime o cartão de membro ou código de barras</p>`;
        focarInputImediato();
      }, 4000);
    }
  </script>
</body>
</html>
