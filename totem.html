<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; overflow: hidden; }
    
    .top-clock { text-align: center; }
    .top-clock h1 { font-size: 1.6rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; font-weight: 700; margin-bottom: 2px; }
    .top-clock h2 { font-size: 3.5rem; color: #ffd43b; font-weight: 800; text-shadow: 0 0 20px rgba(255,212,59,0.5); }

    .totem-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 700px; flex: 1; }
    
    .logo-oval-frame {
      width: 620px;
      height: 290px;
      border: 6px solid #c92a2a;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      box-shadow: 0 0 40px rgba(201, 42, 42, 0.8);
      margin-bottom: 20px;
    }
    .logo-oval-frame img {
      width: 112%;
      height: 112%;
      object-fit: cover;
    }

    .status-box { background: #14171a; border: 3px solid #2b8a3e; border-radius: 12px; padding: 20px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .status-box h3 { font-size: 1.8rem; margin-bottom: 6px; letter-spacing: 1px; }
    .status-box p { font-size: 1.1rem; color: #adb5bd; }

    footer { font-size: 0.8rem; color: #88929b; text-align: center; letter-spacing: 0.5px; }
  </style>
</head>
<body>

  <div class="top-clock">
    <h1 id="date-label">SÁBADO, 10 DE OUTUBRO DE 2026</h1>
    <h2 id="clock-label">12:25:58</h2>
  </div>

  <div class="totem-center">
    <div class="logo-oval-frame">
      <img src="logo.jpg" alt="KOSMO" onerror="this.src='src/img/logo.jpg';">
    </div>

    <div id="totem-display" class="status-box" style="border-color: #2b8a3e;">
      <h3 style="color: #2b8a3e;">PRONTO PARA LEITURA</h3>
      <p>Aproxime o cartão de membro ou código de barras</p>
    </div>
  </div>

  <footer>
    Ginásio KOSMO | Terra Branca, Frente Escola Amor De Deus | NIF: 283023805
  </footer>

  <script>
    const SUPABASE_URL = "https://htybbtbayxreoundolac.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0eWJidGJheXhyZW91bmRvbGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzM1MTksImV4cCI6MjEwNTc0OTUxOX0.1EZ344Xl6gJjNTOO48oflTxKU2lijI7U2E8KLLimnDk";

    let ultimoCheckinId = null;

    function atualizarRelogio() {
      const agora = new Date();
      const dias = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
      const meses = ['DE JANEIRO', 'DE FEVEREIRO', 'DE MARÇO', 'DE ABRIL', 'DE MAIO', 'DE JUNHO', 'DE JULHO', 'DE AGOSTO', 'DE SETEMBRO', 'DE OUTUBRO', 'DE NOVEMBRO', 'DE DEZEMBRO'];
      
      const diaSem = dias[agora.getDay()];
      const diaNum = agora.getDate();
      const mesStr = meses[agora.getMonth()];
      const anoNum = agora.getFullYear();

      document.getElementById('date-label').innerText = `${diaSem}, ${diaNum} ${mesStr} DE ${anoNum}`;
      document.getElementById('clock-label').innerText = agora.toLocaleTimeString('pt-PT');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    async function verificarNovosCheckins() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/kosmo_data?select=*`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        if (res.ok) {
          const rows = await res.json();
          if (rows && rows.length > 0 && rows[0].payload) {
            const logs = rows[0].payload.attendanceLogs;
            if (logs && logs.length > 0) {
              const ultimo = logs[0];
              const identificadorUnico = ultimo.barcode + '_' + ultimo.time + '_' + ultimo.data;
              
              if (identificadorUnico !== ultimoCheckinId) {
                ultimoCheckinId = identificadorUnico;
                mostrarEcranCheckin(ultimo);
              }
            }
          }
        }
      } catch(e) {}
    }

    function mostrarEcranCheckin(log) {
      const box = document.getElementById('totem-display');
      const ativo = log.status === 'Ativo';
      box.style.borderColor = ativo ? '#2b8a3e' : '#d9480f';
      
      const fotoHtml = log.foto ? `<img src="${log.foto}" style="width:140px; height:140px; border-radius:50%; object-fit:cover; border:4px solid ${ativo?'#2b8a3e':'#d9480f'}; margin: 10px auto; display:block; box-shadow: 0 0 20px rgba(0,0,0,0.6);">` : `<div style="font-size:4rem; margin:10px;">👤</div>`;

      box.innerHTML = `
        ${fotoHtml}
        <h3 style="color: ${ativo ? '#2b8a3e' : '#d9480f'}; font-size: 2rem;">${ativo ? '✅ ACESSO PERMITIDO' : '❌ ACESSO NEGADO / EXPIRADO'}</h3>
        <p style="font-size: 1.5rem; font-weight: bold; color: #fff; margin-top:5px;">${log.name}</p>
        <p style="font-size: 1rem; color: #ccc;">Estado: ${log.status} | Hora: ${log.time}</p>
      `;

      if ('speechSynthesis' in window) {
        const textoVoz = ativo ? `Acesso autorizado para ${log.name}` : `Acesso negado para ${log.name}`;
        const msg = new SpeechSynthesisUtterance(textoVoz);
        msg.lang = 'pt-PT';
        msg.rate = 1.0;
        msg.pitch = 1.0;
        window.speechSynthesis.speak(msg);
      }

      setTimeout(() => {
        box.style.borderColor = '#2b8a3e';
        box.innerHTML = `
          <h3 style="color: #2b8a3e;">PRONTO PARA LEITURA</h3>
          <p>Aproxime o cartão de membro ou código de barras</p>
        `;
      }, 5000);
    }

    // Verificação ultra-rápida a cada 500ms para aparecer instantaneamente
    setInterval(verificarNovosCheckins, 500);
  </script>
</body>
</html>
