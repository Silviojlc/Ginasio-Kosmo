<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <style>
    :root { --primary: #c92a2a; --bg: #000000; --success: #2b8a3e; --danger: #d9480f; --text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px 30px; overflow: hidden; }
    
    .totem-top { text-align: center; width: 100%; margin-top: 2px; }
    .totem-data { font-size: 2.5rem; font-weight: 800; text-transform: uppercase; color: #fff; letter-spacing: 2px; margin-bottom: 2px; }
    .totem-relogio { font-size: 7.5rem; font-weight: 900; color: #ffd43b; text-shadow: 0 0 35px rgba(255,212,59,0.6); line-height: 1; }

    .totem-logo-container { width: 100%; display: flex; justify-content: center; align-items: center; margin: 5px 0; }
    .totem-logo-oval { 
      width: 750px; 
      height: 300px; 
      background: #c5d7e6; 
      border-radius: 50%; 
      border: 8px solid var(--primary); 
      box-shadow: 0 0 45px rgba(201, 42, 42, 0.9), inset 0 0 25px rgba(0,0,0,0.15); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
      padding: 15px; 
    }
    .totem-logo-img { width: 100%; height: 100%; object-fit: contain; }
    .totem-oval-avatar { width: 100%; height: 100%; object-fit: cover; object-position: center; border-radius: 50%; }

    .totem-action-box { width: 100%; max-width: 750px; text-align: center; margin-bottom: 5px; }
    .totem-form { display: flex; gap: 10px; margin-bottom: 10px; opacity: 0; position: absolute; pointer-events: none; }
    .totem-input-manual { background: #fff; color: #212529; font-size: 1.4rem; font-weight: 800; padding: 10px 20px; border-radius: 8px; border: 4px solid var(--primary); flex: 1; text-align: center; outline: none; }

    .totem-status-card { background: #161b22; border: 2px solid #333; border-radius: 12px; padding: 12px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-height: 110px; display: flex; align-items: center; justify-content: center; gap: 20px; }
    .status-ok { background: rgba(43, 138, 62, 0.4); color: #51cf66; border: 3px solid var(--success); }
    .status-err { background: rgba(217, 72, 15, 0.4); color: #ff6b6b; border: 3px solid var(--danger); }
    
    .totem-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; background: #333; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #aaa; }

    .totem-footer { font-size: 0.75rem; color: #777; text-align: center; width: 100%; border-top: 1px solid #222; padding-top: 5px; }
  </style>
</head>
<body>

  <div class="totem-top">
    <div class="totem-data" id="data-atual">--</div>
    <div class="totem-relogio" id="relogio">--:--:--</div>
  </div>

  <div class="totem-logo-container">
    <div class="totem-logo-oval" id="totem-oval-container">
      <img src="logo.jpg" alt="KOSMO" class="totem-logo-img" id="totem-oval-content" onerror="this.src='src/img/logo.jpg';">
    </div>
  </div>

  <div class="totem-action-box">
    <form class="totem-form">
      <input type="text" id="totem-barcode-input" autocomplete="off" autofocus>
    </form>
    
    <div id="totem-resultado" class="totem-status-card">
      <div>
        <h3 style="font-size: 1.4rem; color: #fff; margin-bottom: 2px;">PRONTO PARA LEITURA</h3>
        <p style="font-size: 0.95rem; color: #aaa;">Aproxime o cartão de membro ou código de barras</p>
      </div>
    </div>
  </div>

  <div class="totem-footer">
    Ginásio KOSMO | Terra Branca, Frente Escola Amor De Deus | NIF: 283023805
  </div>

  <script>
    const SUPABASE_URL = "https://htybbtbayxreoundolac.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0eWJidGJheXhyZW91bmRvbGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzM1MTksImV4cCI6MjEwNTc0OTUxOX0.1EZ344Xl6gJjNTOO48oflTxKU2lijI7U2E8KLLimnDk";

    let temporizadorReset = null;

    async function ativarAntiHibernacao() {
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch (err) {}
      }
    }
    ativarAntiHibernacao();
    setInterval(ativarAntiHibernacao, 15000);
    setInterval(() => { window.dispatchEvent(new Event('mousemove')); }, 1000);

    function atualizarRelogio() {
      const d = new Date();
      const dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
      const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      
      const elData = document.getElementById('data-atual');
      const elRelogio = document.getElementById('relogio');

      if(elData) elData.innerText = `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
      if(elRelogio) elRelogio.innerText = d.toLocaleTimeString('pt-PT');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    function silenciarSomLocal(silenciar) {
      document.querySelectorAll('audio, video').forEach(media => {
        media.muted = silenciar;
      });
    }

    // Sincronização cruzada instantânea em segundo plano via Storage e Supabase
    window.addEventListener('storage', (e) => {
      if (e.key === 'kosmo_attendance' || e.key === 'kosmo_trigger_checkin') {
        const logs = JSON.parse(localStorage.getItem('kosmo_attendance')) || [];
        if (logs.length > 0) {
          processarCheckinTotemObjeto(logs[0]);
        }
      }
    });

    async function verificarCheckinsSegundoPlano() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/kosmo_data?select=*`, {
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          const rows = await res.json();
          if (rows && rows.length > 0 && rows[0].payload) {
            const dados = rows[0].payload;
            const logs = dados.attendanceLogs || [];
            if (logs.length > 0) {
              const ultimo = logs[0];
              const chaveUnica = ultimo.barcode + '_' + ultimo.time + '_' + ultimo.data;
              const ultimaProcessada = localStorage.getItem('totem_ultimo_processado');
              
              if (chaveUnica !== ultimaProcessada) {
                localStorage.setItem('totem_ultimo_processado', chaveUnica);
                processarCheckinTotemObjeto(ultimo, dados.members || []);
              }
            }
          }
        }
      } catch(e) {}
    }
    setInterval(verificarCheckinsSegundoPlano, 200);

    async function processarCheckinTotemObjeto(logItem, membrosLista) {
      if (temporizadorReset) clearTimeout(temporizadorReset);

      const resBox = document.getElementById('totem-resultado');
      resBox.className = "totem-status-card";
      resBox.innerHTML = `<h3 style="font-size: 1.3rem; color: #ffd43b;">A verificar ID: ${logItem.barcode}...</h3>`;

      let membros = membrosLista;
      if (!membros || membros.length === 0) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/kosmo_data?select=*`, {
            headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
          });
          if (res.ok) {
            const rows = await res.json();
            if (rows && rows.length > 0 && rows[0].payload) {
              membros = rows[0].payload.members || [];
            }
          }
        } catch(e) {
          membros = JSON.parse(localStorage.getItem('kosmo_members')) || [];
        }
      }

      const membro = membros.find(m => {
        const b = String(m.barcode || m.id || '').trim();
        return b === String(logItem.barcode).trim();
      });

      const now = new Date();
      const ovalContainer = document.getElementById('totem-oval-content');

      if (membro) {
        const dataFim = new Date(membro.date || '2026-01-01');
        dataFim.setDate(dataFim.getDate() + 30);
        
        const estadoStr = (membro.estado || 'Ativo').trim();
        const subscricaoExpirada = dataFim < now;
        const membroInativo = estadoStr === 'Inativo' || estadoStr === 'Desativado';
        const ativo = !membroInativo && !subscricaoExpirada;

        const nomeMembro = membro.name || 'Membro';
        const planoMembro = membro.plan || 'Normal';
        const fotoMembro = membro.foto ? `<img src="${membro.foto}" class="totem-avatar">` : `<div class="totem-avatar">👤</div>`;

        if (membro.foto && ovalContainer) {
          ovalContainer.outerHTML = `<img src="${membro.foto}" alt="${nomeMembro}" class="totem-oval-avatar" id="totem-oval-content">`;
        } else if (ovalContainer) {
          ovalContainer.outerHTML = `<div class="totem-oval-avatar" id="totem-oval-content" style="display:flex;align-items:center;justify-content:center;font-size:4rem;background:#333;color:#aaa;">👤</div>`;
        }

        let textoVoz = "";

        if (ativo) {
          resBox.className = "totem-status-card status-ok";
          resBox.innerHTML = `
            ${fotoMembro}
            <div style="text-align: left;">
              <h3 style="font-size: 1.8rem; margin-bottom: 2px;">✅ ACESSO AUTORIZADO</h3>
              <p style="font-size: 1.3rem; font-weight: bold;">${nomeMembro}</p>
              <p style="font-size: 0.95rem; color: #d4edda;">Plano: ${planoMembro}</p>
            </div>
          `;
          textoVoz = "Mensalidade ativa. Tenha um Bom treino.";
        } else if (subscricaoExpirada) {
          resBox.className = "totem-status-card status-err";
          resBox.innerHTML = `
            ${fotoMembro}
            <div style="text-align: left;">
              <h3 style="font-size: 1.8rem; margin-bottom: 2px;">❌ SUBSCRIÇÃO EXPIRADA</h3>
              <p style="font-size: 1.3rem; font-weight: bold;">${nomeMembro}</p>
              <p style="font-size: 0.95rem; color: #f8d7da;">Mensalidade Expirada. Voce não pode treinar.</p>
            </div>
          `;
          textoVoz = "Mensalidade Expirada. Voce não pode treinar.";
        } else {
          resBox.className = "totem-status-card status-err";
          resBox.innerHTML = `
            ${fotoMembro}
            <div style="text-align: left;">
              <h3 style="font-size: 1.8rem; margin-bottom: 2px;">❌ CONTA INATIVA</h3>
              <p style="font-size: 1.3rem; font-weight: bold;">${nomeMembro}</p>
              <p style="font-size: 0.95rem; color: #f8d7da;">Mensalidade Inativa. Voce não pode treinar.</p>
            </div>
          `;
          textoVoz = "Mensalidade Inativa. Voce não pode treinar.";
        }

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance(textoVoz);
          msg.lang = 'pt-PT';
          msg.rate = 0.95;
          msg.pitch = 1.1;
          msg.volume = 1.0;

          silenciarSomLocal(true);
          msg.onend = () => { silenciarSomLocal(false); };
          msg.onerror = () => { silenciarSomLocal(false); };

          window.speechSynthesis.speak(msg);
        }

      } else {
        resBox.className = "totem-status-card status-err";
        resBox.innerHTML = `
          <div style="text-align: center;">
            <h3 style="font-size: 1.8rem; margin-bottom: 2px;">❌ CARTÃO DESCONHECIDO</h3>
            <p style="font-size: 1.1rem;">ID "${logItem.barcode}" não registado no sistema</p>
          </div>
        `;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance("Cartão desconhecido. Acesso negado.");
          msg.lang = 'pt-PT';
          msg.volume = 1.0;
          window.speechSynthesis.speak(msg);
        }
      }

      // Mantém a foto no espaço oval e o estado exatamente durante 4 minutos (240000 ms) antes de voltar ao estado inicial
      temporizadorReset = setTimeout(() => {
        resBox.className = "totem-status-card";
        resBox.innerHTML = `
          <div>
            <h3 style="font-size: 1.4rem; color: #fff; margin-bottom: 2px;">PRONTO PARA LEITURA</h3>
            <p style="font-size: 0.95rem; color: #aaa;">Aproxime o cartão de membro ou código de barras</p>
          </div>
        `;

        const ovalElement = document.getElementById('totem-oval-content');
        if (ovalElement) {
          ovalElement.outerHTML = `<img src="logo.jpg" alt="KOSMO" class="totem-logo-img" id="totem-oval-content" onerror="this.src='src/img/logo.jpg';">`;
        }
      }, 240000);
    }
  </script>
</body>
</html>
