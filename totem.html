<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <style>
    :root { --primary: #c92a2a; --bg: #000000; --success: #2b8a3e; --danger: #d9480f; --text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px 30px; overflow: hidden; }
    
    .totem-top { text-align: center; width: 100%; margin-top: 2px; }
    .totem-data { font-size: 2.5rem; font-weight: 800; text-transform: uppercase; color: #fff; letter-spacing: 2px; margin-bottom: 2px; }
    .totem-relogio { font-size: 7.5rem; font-weight: 900; color: #ffd43b; text-shadow: 0 0 35px rgba(255,212,59,0.6); line-height: 1; }

    .totem-logo-container { width: 100%; display: flex; justify-content: center; align-items: center; margin: 5px 0; position: relative; }
    .totem-logo-oval { 
      width: 750px; 
      height: 300px; 
      background: #c5d7e6; 
      border-radius: 50%; 
      border: 8px solid var(--primary); 
      box-shadow: 0 0 55px rgba(201, 42, 42, 0.7), inset 0 0 25px rgba(0,0,0,0.15); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
      position: relative;
    }
    .totem-logo-img { 
      width: 105%; 
      height: 105%; 
      object-fit: contain; 
      transition: opacity 0.3s ease; 
    }
    
    .totem-membro-foto-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0b131a;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: none;
      z-index: 10;
      border-radius: 50%;
    }

    .totem-action-box { width: 100%; max-width: 750px; text-align: center; margin-bottom: 5px; }
    .totem-form { display: flex; gap: 10px; margin-bottom: 10px; position: absolute; left: -9999px; }
    
    .totem-status-card { 
        background: #161b22; 
        border: 2px solid #333; 
        border-radius: 12px; 
        padding: 15px 25px; 
        width: 100%; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        min-height: 120px; 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        justify-content: center; 
        text-align: center;
        transition: all 0.4s ease;
    }
    
    .status-ok { background: rgba(43, 138, 62, 0.95); color: #fff; border: 4px solid #fff; box-shadow: 0 0 40px rgba(43,138,62,0.9); }
    .status-err { background: rgba(217, 72, 15, 0.95); color: #fff; border: 4px solid #fff; box-shadow: 0 0 40px rgba(217,72,15,0.9); }
    
    .totem-status-main-text { font-size: 2.4rem; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .totem-status-member-name { font-size: 1.8rem; font-weight: bold; color: #fff; margin-bottom: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .totem-status-plan { font-size: 1.1rem; opacity: 0.9; }

    .totem-footer { font-size: 0.75rem; color: #777; text-align: center; width: 100%; border-top: 1px solid #222; padding-top: 5px; }
  </style>
</head>
<body onclick="focarInput()">

  <div class="totem-top">
    <div class="totem-data" id="data-atual">--</div>
    <div class="totem-relogio" id="relogio">--:--:--</div>
  </div>

  <div class="totem-logo-container">
    <div class="totem-logo-oval" id="totem-oval-visual">
      <img src="logo.jpg" alt="KOSMO" class="totem-logo-img" id="totem-logo-image" onerror="this.src='src/img/logo.jpg';">
      <div id="membro-foto-capa" class="totem-membro-foto-overlay"></div>
    </div>
  </div>

  <div class="totem-action-box">
    <form class="totem-form" onsubmit="event.preventDefault(); executarCheckin();">
      <input type="text" id="totem-barcode-input" autocomplete="off" autofocus oninput="detetarLeituraInstantanea(this)">
    </form>
    
    <div id="totem-resultado" class="totem-status-card">
      <div>
        <h3 style="font-size: 1.5rem; color: #fff; margin-bottom: 4px;">PRONTO PARA LEITURA</h3>
        <p style="font-size: 1.1rem; color: #aaa;">Aproxime o cartão de membro ou código de barras</p>
      </div>
    </div>
  </div>

  <div class="totem-footer">
    Ginásio KOSMO | Terra Branca, Frente Escola Amor De Deus | NIF: 283023805
  </div>

  <script>
    let temporizadorReset = null;

    function falarMensagemVoz(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Para qualquer fala anterior imediatamente
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-PT';
        utterance.volume = 1.0; // Volume máximo
        utterance.rate = 1.0;  // Velocidade natural e nítida
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function atualizarRelogio() {
      const d = new Date();
      const dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
      const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      
      const elData = document.getElementById('data-atual');
      const elRelogio = document.getElementById('relogio');

      if(elData) elData.innerText = `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
      if(elRelogio) elRelogio.innerText = d.toLocaleTimeString('pt-PT');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    const inputLeitor = document.getElementById('totem-barcode-input');
    const capaFoto = document.getElementById('membro-foto-capa');
    const resBox = document.getElementById('totem-resultado');

    function focarInput() {
      if (inputLeitor) inputLeitor.focus();
    }
    
    setInterval(focarInput, 150);
    window.onload = focarInput;
    document.body.onclick = focarInput;

    let timeoutInput = null;
    function detetarLeituraInstantanea(el) {
      const valor = el.value.trim();
      if (valor.length >= 3) {
        clearTimeout(timeoutInput);
        timeoutInput = setTimeout(async () => {
          const codigo = el.value.trim();
          el.value = '';
          if (codigo) await processarCheckinTotem(codigo);
        }, 120);
      }
    }

    async function executarCheckin() {
      const codigo = inputLeitor.value.trim();
      if (!codigo) return;
      inputLeitor.value = '';
      await processarCheckinTotem(codigo);
    }

    function resetVisualTotem() {
        if (temporizadorReset) clearTimeout(temporizadorReset);
        
        capaFoto.style.display = 'none';
        capaFoto.style.backgroundImage = '';
        
        resBox.className = "totem-status-card";
        resBox.innerHTML = `
          <div>
            <h3 style="font-size: 1.5rem; color: #fff; margin-bottom: 4px;">PRONTO PARA LEITURA</h3>
            <p style="font-size: 1.1rem; color: #aaa;">Aproxime o cartão de membro ou código de barras</p>
          </div>
        `;
        focarInput();
    }

    async function processarCheckinTotem(codigo) {
      if (temporizadorReset) clearTimeout(temporizadorReset);

      resBox.className = "totem-status-card";
      resBox.innerHTML = `<h3 style="font-size: 1.3rem; color: #ffd43b;">A verificar ID: ${codigo}...</h3>`;

      // Lê da nuvem local unificada
      let membrosLocais = [];
      try {
        const dadosSync = JSON.parse(localStorage.getItem('kosmo_global_sync'));
        if (dadosSync && dadosSync.members) membrosLocais = dadosSync.members;
      } catch(e) {}
      if (membrosLocais.length === 0) {
        membrosLocais = JSON.parse(localStorage.getItem('kosmo_members')) || [];
      }

      const membro = membrosLocais.find(m => {
        const b = String(m.barcode || m.id || '').trim();
        return b === String(codigo).trim();
      });

      const now = new Date();

      if (membro) {
        const dataFim = new Date(membro.date || '2026-01-01');
        dataFim.setDate(dataFim.getDate() + 30);
        const ativo = dataFim >= now && ((membro.estado || 'Ativo') === 'Ativo');
        const nomeMembro = membro.name || 'Membro';
        const planoMembro = membro.plan || 'Normal';
        
        if (membro.foto && membro.foto.startsWith('data:image')) {
            capaFoto.style.backgroundImage = `url('${membro.foto}')`;
            capaFoto.style.display = 'block';
        } else {
            capaFoto.style.display = 'none';
        }

        if (ativo) {
          resBox.className = "totem-status-card status-ok";
          resBox.innerHTML = `
            <div class="totem-status-main-text">✅ ACESSO AUTORIZADO</div>
            <div class="totem-status-member-name">${nomeMembro}</div>
            <div class="totem-status-plan">Plano: ${planoMembro}</div>
          `;
          // VOZ ALTA E CLARA PARA ATIVO
          falarMensagemVoz("Mensalidade ativa. Tenha um bom treino!");
        } else {
          resBox.className = "totem-status-card status-err";
          resBox.innerHTML = `
            <div class="totem-status-main-text">❌ SUBSCRIÇÃO EXPIRADA</div>
            <div class="totem-status-member-name">${nomeMembro}</div>
            <div class="totem-status-plan">Por favor, renove o plano</div>
          `;
          // VOZ ALTA E CLARA PARA INATIVO/EXPIRADO
          falarMensagemVoz("Mensalidade inativa ou expirada. Você não pode treinar!");
        }

        let logs = [];
        try {
          const dadosSync = JSON.parse(localStorage.getItem('kosmo_global_sync'));
          if (dadosSync && dadosSync.attendanceLogs) logs = dadosSync.attendanceLogs;
        } catch(e) {}
        if (logs.length === 0) logs = JSON.parse(localStorage.getItem('kosmo_attendance')) || [];

        logs.unshift({
          data: now.toLocaleDateString('pt-PT'),
          time: now.toLocaleTimeString('pt-PT'),
          name: nomeMembro,
          barcode: codigo,
          status: ativo ? 'Ativo' : 'Expirado',
          foto: membro.foto || ''
        });
        
        localStorage.setItem('kosmo_attendance', JSON.stringify(logs));
        try {
          const dadosSync = JSON.parse(localStorage.getItem('kosmo_global_sync')) || {};
          dadosSync.attendanceLogs = logs;
          localStorage.setItem('kosmo_global_sync', JSON.stringify(dadosSync));
        } catch(e) {}

      } else {
        capaFoto.style.display = 'none';
        resBox.className = "totem-status-card status-err";
        resBox.innerHTML = `
          <div style="text-align: center;">
            <div class="totem-status-main-text">❌ CARTÃO DESCONHECIDO</div>
            <div class="totem-status-member-name">ID "${codigo}"</div>
            <div class="totem-status-plan">não registado no sistema</div>
          </div>
        `;
        // VOZ PARA CARTÃO DESCONHECIDO
        falarMensagemVoz("Cartão desconhecido. Acesso não permitido!");
      }

      // Temporizador de 5 minutos (300000ms) antes de voltar ao normal
      temporizadorReset = setTimeout(resetVisualTotem, 300000);
    }
  </script>
</body>
</html>
