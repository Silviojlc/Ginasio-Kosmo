<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px 20px; overflow: hidden; }
    
    .top-clock { text-align: center; margin-top: 5px; width: 100%; }
    .top-clock h1 { font-size: 3.5rem; text-transform: uppercase; letter-spacing: 3px; color: #fff; font-weight: 900; margin-bottom: 2px; }
    .top-clock h2 { font-size: 8.5rem; color: #ffd43b; font-weight: 900; line-height: 1; text-shadow: 0 0 35px rgba(255,212,59,0.8); }

    .totem-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 800px; flex: 1; }
    
    .logo-oval-frame {
      width: 680px;
      height: 320px;
      border: 7px solid #c92a2a;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      box-shadow: 0 0 45px rgba(201, 42, 42, 0.9);
      margin-bottom: 10px;
    }
    .logo-oval-frame img {
      width: 115%;
      height: 115%;
      object-fit: cover;
    }

    .scanner-box-ui { width: 100%; max-width: 400px; margin-bottom: 5px; opacity: 0; position: absolute; pointer-events: none; }

    .status-box { background: #14171a; border: 3px solid #2b8a3e; border-radius: 12px; padding: 15px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .status-box h3 { font-size: 1.9rem; margin-bottom: 4px; letter-spacing: 1px; }
    .status-box p { font-size: 1.15rem; color: #adb5bd; }

    footer { font-size: 0.75rem; color: #88929b; text-align: center; letter-spacing: 0.5px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="top-clock">
    <h1 id="date-label">SÁBADO, 10 DE OUTUBRO DE 2026</h1>
    <h2 id="clock-label">12:25:58</h2>
  </div>

  <div class="totem-center">
    <div class="logo-oval-frame">
      <img src="logo.jpg" alt="KOSMO" onerror="this.src='src/img/logo.jpg';">
    </div>

    <div class="scanner-box-ui">
      <input type="text" id="totem-input-direto" autofocus autocomplete="off" onkeydown="processarLeituraTotem(event)">
    </div>

    <div id="totem-display" class="status-box" style="border-color: #2b8a3e;">
      <h3 style="color: #2b8a3e;">PRONTO PARA LEITURA</h3>
      <p>Aproxime o cartão de membro ou código de barras</p>
    </div>
  </div>

  <footer>
    Ginásio KOSMO | Terra Branca, Frente Escola Amor De Deus | NIF: 283023805
  </footer>

  <script>
    const SUPABASE_URL = "https://htybbtbayxreoundolac.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0eWJidGJheXhyZW91bmRvbGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzM1MTksImV4cCI6MjEwNTc0OTUxOX0.1EZ344Xl6gJjNTOO48oflTxKU2lijI7U2E8KLLimnDk";

    let ultimoCheckinKey = null;

    // Prevenir hibernação e suspensão do ecrã do Totem permanentemente
    async function ativarAntiHibernacao() {
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch (err) {}
      }
    }
    ativarAntiHibernacao();
    setInterval(ativarAntiHibernacao, 15000);
    setInterval(() => { window.dispatchEvent(new Event('mousemove')); }, 1000);

    // Manter o foco ativo no leitor sem precisar de rato
    function focarCaixaLeitor() {
      const inp = document.getElementById('totem-input-direto');
      if (inp) inp.focus();
    }
    window.addEventListener('click', focarCaixaLeitor);
    window.addEventListener('keydown', focarCaixaLeitor);
    setInterval(focarCaixaLeitor, 500);

    function atualizarRelogio() {
      const agora = new Date();
      const dias = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
      const meses = ['DE JANEIRO', 'DE FEVEREIRO', 'DE MARÇO', 'DE ABRIL', 'DE MAIO', 'DE JUNHO', 'DE JULHO', 'DE AGOSTO', 'DE SETEMBRO', 'DE OUTUBRO', 'DE NOVEMBRO', 'DE DEZEMBRO'];
      
      document.getElementById('date-label').innerText = `${dias[agora.getDay()]}, ${agora.getDate()} ${meses[agora.getMonth()]} DE ${agora.getFullYear()}`;
      document.getElementById('clock-label').innerText = agora.toLocaleTimeString('pt-PT');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    async function processarLeituraTotem(e) {
      if (e.key === 'Enter') {
        const inputEl = document.getElementById('totem-input-direto');
        const code = inputEl.value.trim();
        inputEl.value = '';
        if (!code) return;

        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/kosmo_data?select=*`, {
            headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
          });
          if (res.ok) {
            const rows = await res.json();
            if (rows && rows.length > 0 && rows[0].payload) {
              const dados = rows[0].payload;
              const members = dados.members || [];
              const m = members.find(x => x.barcode === code);
              
              const now = new Date();
              let ativo = false;
              let nome = 'Desconhecido';
              let estadoStr = 'Expirado';

              if (m) {
                nome = m.name;
                const d = new Date(m.date || '2026-01-01');
                d.setDate(d.getDate() + 30);
                if (m.estado === 'Inativo' || m.estado === 'Desativado') {
                  estadoStr = m.estado;
                  ativo = false;
                } else if (d < now) {
                  estadoStr = 'Expirado';
                  ativo = false;
                } else {
                  estadoStr = 'Ativo';
                  ativo = true;
                }
              }

              const logEntry = {
                data: now.toLocaleDateString('pt-PT'),
                time: now.toLocaleTimeString('pt-PT'),
                name: nome,
                barcode: code,
                status: estadoStr,
                foto: m ? m.foto : ''
              };

              dados.attendanceLogs = dados.attendanceLogs || [];
              dados.attendanceLogs.unshift(logEntry);

              await fetch(`${SUPABASE_URL}/rest/v1/kosmo_data`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Prefer': 'resolution=merge-duplicates'
                },
                body: JSON.stringify({ id: 1, payload: dados })
              });

              mostrarEcranCheckin(logEntry);
            }
          }
        } catch(err) {}
      }
    }

    // Sincronização em tempo real ultra-rápida (300ms) para refletir check-ins manuais do painel imediatamente
    async function verificarCheckinsTempoReal() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/kosmo_data?select=*`, {
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          const rows = await res.json();
          if (rows && rows.length > 0 && rows[0].payload) {
            const logs = rows[0].payload.attendanceLogs || [];
            if (logs.length > 0) {
              const ultimo = logs[0];
              const chaveUnica = ultimo.barcode + '_' + ultimo.time + '_' + ultimo.data;
              if (!ultimoCheckinKey) {
                ultimoCheckinKey = chaveUnica;
                return;
              }
              if (chaveUnica !== ultimoCheckinKey) {
                ultimoCheckinKey = chaveUnica;
                mostrarEcranCheckin(ultimo);
              }
            }
          }
        }
      } catch(e) {}
    }

    function mostrarEcranCheckin(log) {
      const box = document.getElementById('totem-display');
      const ativo = log.status === 'Ativo';
      box.style.borderColor = ativo ? '#2b8a3e' : '#d9480f';
      
      const fotoHtml = log.foto ? `<img src="${log.foto}" style="width:160px; height:160px; border-radius:50%; object-fit:cover; border:4px solid ${ativo?'#2b8a3e':'#d9480f'}; margin: 10px auto; display:block; box-shadow: 0 0 25px rgba(0,0,0,0.7);">` : `<div style="font-size:4.5rem; margin:10px;">👤</div>`;

      box.innerHTML = `
        ${fotoHtml}
        <h3 style="color: ${ativo ? '#2b8a3e' : '#d9480f'}; font-size: 2.1rem;">${ativo ? '✅ ACESSO PERMITIDO - MEMBRO ATIVO' : '❌ ACESSO NEGADO - ' + log.status.toUpperCase()}</h3>
        <p style="font-size: 1.6rem; font-weight: bold; color: #fff; margin-top:5px;">${log.name}</p>
        <p style="font-size: 1.05rem; color: #ccc;">Estado: ${log.status} | Hora: ${log.time}</p>
      `;

      if ('speechSynthesis' in window) {
        let textoVoz = ativo 
          ? `Acesso autorizado. Seja bem-vindo ao ginásio KOSMO, ${log.name}. Bom treino!` 
          : `Atenção. Acesso negado para ${log.name}. O seu plano encontra-se ${log.status}. Por favor, dirija-se à receção.`;
        
        const msg = new SpeechSynthesisUtterance(textoVoz);
        msg.lang = 'pt-PT';
        msg.rate = 1.0;
        msg.pitch = 1.0;
        window.speechSynthesis.speak(msg);
      }

      // A foto e o estado permanecem no ecrã exatamente durante 4 minutos (240000 ms) antes de voltar ao estado original
      if (window.totemTimeout) clearTimeout(window.totemTimeout);
      window.totemTimeout = setTimeout(() => {
        box.style.borderColor = '#2b8a3e';
        box.innerHTML = `
          <h3 style="color: #2b8a3e;">PRONTO PARA LEITURA</h3>
          <p>Aproxime o cartão de membro ou código de barras</p>
        `;
        focarCaixaLeitor();
      }, 240000);
    }

    setInterval(verificarCheckinsTempoReal, 300);
  </script>
</body>
</html>
