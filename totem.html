<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Ginásio KOSMO - Ecrã Totem Gigante</title>
  <style>
    body { background: #0b0e11; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; box-sizing: border-box; text-align: center; overflow: hidden; }
    .badge { padding: 25px 80px; border-radius: 16px; font-size: 3.5rem; font-weight: 900; color: #fff; display: inline-block; margin-top: 25px; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  </style>
</head>
<body>
  <div style="width:100%; display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #222; padding-bottom:20px;">
    <div style="display:flex; align-items:center; gap:15px;">
      <img src="assets/img/logo.jpg" alt="KOSMO" style="height:65px; object-fit:contain; background:#fff; border-radius:6px; padding:4px;" onerror="this.src='logo.jpg';">
      <div style="font-size:1.8rem; color:#aaa; font-weight:800; letter-spacing:1px; text-align:left;">TERMINAL DE CHECK-IN KOSMO</div>
    </div>
    <div id="totem-relogio" style="font-size: 5.5rem; font-family: monospace; color: #ffd43b; font-weight: 900; letter-spacing: 2px;">00:00:00</div>
  </div>
  
  <div id="totem-corpo" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 style="color:#ffd43b; font-size:4.8rem; margin:15px 0; font-weight:900;">Aproxime o seu Cartão / QR Code</h1>
    <p style="font-size:2.4rem; color:#ddd; font-style:italic; max-width:1100px; font-weight:700; line-height:1.4;">"Moldar o seu corpo ao seu estilo através de uma forma correta e saudável"</p>
  </div>

  <div style="color:#777; font-size:1.3rem; text-align:center; font-weight:bold;">Ginásio KOSMO • Praia, Cabo Verde • NIF: 283023805</div>

  <script>
    let resetTimer = null;
    function voltarEcraInicial() {
      document.getElementById('totem-corpo').innerHTML = `
        <h1 style="color:#ffd43b; font-size:4.8rem; margin:15px 0; font-weight:900;">Aproxime o seu Cartão / QR Code</h1>
        <p style="font-size:2.4rem; color:#ddd; font-style:italic; max-width:1100px; font-weight:700; line-height:1.4;">"Moldar o seu corpo ao seu estilo através de uma forma correta e saudável"</p>
      `;
    }

    function processarCheckinTotem(d) {
      if (resetTimer) clearTimeout(resetTimer);
      const bgCol = d.auth ? '#2b8a3e' : '#c92a2a';
      document.getElementById('totem-corpo').innerHTML = `
        <h1 style="color:${bgCol}; font-size:5.5rem; margin:10px 0; font-weight:900;">${d.name}</h1>
        <p style="font-size:2.5rem; font-weight:bold; margin-bottom:15px;">Plano: ${d.plan}</p>
        <div class="badge" style="background:${bgCol};">ACESSO PERMITIDO</div>
      `;
      resetTimer = setTimeout(() => { voltarEcraInicial(); }, 15000);
    }

    setInterval(() => {
      document.getElementById('totem-relogio').innerText = new Date().toLocaleTimeString('pt-PT');
    }, 1000);

    window.addEventListener('storage', (event) => {
      if (event.key === 'kosmo_totem_scan') {
        try { const d = JSON.parse(event.newValue); if (d) processarCheckinTotem(d); } catch(e) {}
      }
    });
  </script>
</body>
</html>
