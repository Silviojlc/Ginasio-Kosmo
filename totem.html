<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px 20px; overflow: hidden; }
    
    .top-clock { text-align: center; margin-top: 5px; }
    .top-clock h1 { font-size: 2.1rem; text-transform: uppercase; letter-spacing: 2px; color: #fff; font-weight: 800; margin-bottom: 4px; }
    .top-clock h2 { font-size: 4.8rem; color: #ffd43b; font-weight: 900; text-shadow: 0 0 25px rgba(255,212,59,0.6); }

    .totem-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 780px; flex: 1; }
    
    .logo-oval-frame {
      width: 680px;
      height: 320px;
      border: 7px solid #c92a2a;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      box-shadow: 0 0 45px rgba(201, 42, 42, 0.9);
      margin-bottom: 20px;
    }
    .logo-oval-frame img {
      width: 115%;
      height: 115%;
      object-fit: cover;
    }
    .logo-oval-frame .oval-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
    }

    .status-box { background: #14171a; border: 3px solid #2b8a3e; border-radius: 12px; padding: 20px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .status-box h3 { font-size: 1.9rem; margin-bottom: 6px; letter-spacing: 1px; }
    .status-box p { font-size: 1.2rem; color: #adb5bd; }

    /* Input invisível cravado para capturar o leitor Approx LS21 em absoluto segundo plano sem cliques */
    .scanner-input-oculto { position: absolute; opacity: 0; pointer-events: none; }

    footer { font-size: 0.8rem; color: #88929b; text-align: center; letter-spacing: 0.5px; margin-bottom: 5px; }
  </style>
</head>
<body onclick="focarLeitor()" onkeydown="focarLeitor()">

  <input type="text" id="totem-input-scanner" class="scanner-input-oculto" autofocus autocomplete="off" oninput="processarLeitura(this)">

  <div class="top-clock">
    <h1 id="date-label">SÁBADO, 10 DE OUTUBRO DE 2026</h1>
    <h2 id="clock-label">19:39:34</h2>
  </div>

  <div class="totem-center">
    <div class="logo-oval-frame" id="totem-oval-container">
      <img src="logo.jpg" alt="KOSMO" id="totem-oval-content" onerror="this.src='src/img/logo.jpg';">
    </div>

    <div id="totem-display" class="status-box" style="border-color: #2b8a3e;">
      <h3 style="color: #2b8a3e;">PRONTO PARA LEITURA</h3>
      <p>Aproxime o cartão de membro ou código de barras</p>
    </div>
  </div>

  <footer>
    Ginásio KOSMO | Terra Branca, Frente Escola Amor De Deus | NIF: 283023805
  </footer>

  <script>
    const SUPABASE_URL = "https://htybbtbayxreoundolac.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0eWJidGJheXhyZW91bmRvbGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzM1MTksImV4cCI6MjEwNTc0OTUxOX0.1EZ344Xl6gJjNTOO48oflTxKU2lijI7U2E8KLLimnDk";

    let temporizadorReset = null;

    // Prevenir hibernação e suspensão do ecrã permanentemente
    async function ativarAntiHibernacao() {
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch (err) {}
      }
    }
    ativarAntiHibernacao();
    setInterval(ativarAntiHibernacao, 15000);
    setInterval(() => { window.dispatchEvent(new Event('mousemove')); }, 1000);

    function atualizarRelogio() {
      const agora = new Date();
      const dias = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
      const meses = ['DE JANEIRO', 'DE FEVEREIRO', 'DE MARÇO', 'DE ABRIL', 'DE MAIO', 'DE JUNHO', 'DE JULHO', 'DE AGOSTO', 'DE SETEMBRO', 'DE OUTUBRO', 'DE NOVEMBRO', 'DE DEZEMBRO'];
      
      document.getElementById('date-label').innerText = `${dias[agora.getDay()]}, ${agora.getDate()} ${meses[agora.getMonth()]} DE ${agora.getFullYear()}`;
      document.getElementById('clock-label').innerText = agora.toLocaleTimeString('pt-PT');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    const inputScanner = document.getElementById('totem-input-scanner');

    // Foco cravado e contínuo no input oculto para o leitor responder sempre sem cliques
    function focarLeitor() {
      if (inputScanner && document.activeElement !== inputScanner) {
        inputScanner.focus();
      }
    }
    setInterval(focarLeitor, 50);
    window.onload = focarLeitor;
    window.addEventListener('click', focarLeitor);
    window.addEventListener('keydown', focarLeitor);

    let timeoutScanner = null;
    function processarLeitura(el) {
      const valor = el.value.trim();
      if (valor.length >= 3) {
        clearTimeout(timeoutScanner);
        timeoutScanner = setTimeout(async () => {
          const codigo = el.value.trim();
          el.value = '';
          if (codigo) await executarCheckinTotem(codigo);
        }, 80);
      }
    }

    function silenciarSomLocal(silenciar) {
      document.querySelectorAll('audio, video').forEach(media => {
        media.muted = silenciar;
      });
    }

    async function executarCheckinTotem(codigo) {
      if (temporizadorReset) clearTimeout(temporizadorReset);

      const box = document.getElementById('totem-display');
      const ovalContent = document.getElementById('totem-oval-content');

      box.style.borderColor = '#ffd43b';
      box.innerHTML = `<h3 style="color: #ffd43b;">A verificar ID: ${codigo}...</h3><p>Aguarde um momento</p>`;

      let membros = [];
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/kosmo_data?select=*`, {
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          const rows = await res.json();
          if (rows && rows.length > 0 && rows[0].payload) {
            membros = rows[0].payload.members || [];
          }
        }
      } catch(e) {
        membros = JSON.parse(localStorage.getItem('kosmo_members')) || [];
      }

      const membro = membros.find(m => {
        const b = String(m.barcode || m.id || '').trim();
        return b === String(codigo).trim();
      });

      const now = new Date();

      if (membro) {
        const dataFim = new Date(membro.date || '2026-01-01');
        dataFim.setDate(dataFim.getDate() + 30);
        
        const estadoStr = (membro.estado || 'Ativo').trim();
        const subscricaoExpirada = dataFim < now;
        const membroInativo = estadoStr === 'Inativo' || estadoStr === 'Desativado';
        const ativo = !membroInativo && !subscricaoExpirada;

        const nomeMembro = membro.name || 'Membro';
        const planoMembro = membro.plan || 'Normal';

        // Exibe a cara inteira do membro perfeitamente ajustada no oval do logótipo
        if (membro.foto && ovalContent) {
          ovalContent.outerHTML = `<img src="${membro.foto}" alt="${nomeMembro}" class="oval-avatar" id="totem-oval-content">`;
        } else if (ovalContent) {
          ovalContent.outerHTML = `<div class="oval-avatar" id="totem-oval-content" style="display:flex;align-items:center;justify-content:center;font-size:5rem;background:#333;color:#aaa;">👤</div>`;
        }

        let textoVoz = "";

        if (ativo) {
          box.style.borderColor = '#2b8a3e';
          box.innerHTML = `
            <h3 style="color: #2b8a3e; font-size: 2.1rem;">✅ ACESSO PERMITIDO - MEMBRO ATIVO</h3>
            <p style="font-size: 1.6rem; font-weight: bold; color: #fff;">${nomeMembro}</p>
            <p style="font-size: 1.05rem; color: #d4edda;">Plano: ${planoMembro}</p>
          `;
          textoVoz = "Mensalidade ativa. Tenha um Bom treino.";
        } else if (subscricaoExpirada) {
          box.style.borderColor = '#d9480f';
          box.innerHTML = `
            <h3 style="color: #d9480f; font-size: 2.1rem;">❌ ACESSO NEGADO - EXPIRADO</h3>
            <p style="font-size: 1.6rem; font-weight: bold; color: #fff;">${nomeMembro}</p>
            <p style="font-size: 1.05rem; color: #f8d7da;">Subscrição expirada. Por favor, renove.</p>
          `;
          textoVoz = "Mensalidade Expirada. Voce não pode treinar.";
        } else {
          box.style.borderColor = '#d9480f';
          box.innerHTML = `
            <h3 style="color: #d9480f; font-size: 2.1rem;">❌ ACESSO NEGADO - INATIVO</h3>
            <p style="font-size: 1.6rem; font-weight: bold; color: #fff;">${nomeMembro}</p>
            <p style="font-size: 1.05rem; color: #f8d7da;">Conta inativa. Dirija-se à receção.</p>
          `;
          textoVoz = "Mensalidade Inativa. Voce não pode treinar.";
        }

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance(textoVoz);
          msg.lang = 'pt-PT';
          msg.rate = 0.95;  // Firme e pausada
          msg.pitch = 1.1;  // Clara e viva
          msg.volume = 1.0; // Volume alto

          silenciarSomLocal(true);
          msg.onend = () => { silenciarSomLocal(false); };
          msg.onerror = () => { silenciarSomLocal(false); };

          window.speechSynthesis.speak(msg);
        }

      } else {
        box.style.borderColor = '#d9480f';
        box.innerHTML = `
          <h3 style="color: #d9480f; font-size: 2.1rem;">❌ CARTÃO DESCONHECIDO</h3>
          <p style="font-size: 1.2rem; color: #fff;">ID "${codigo}" não registado no sistema</p>
        `;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance("Cartão desconhecido. Acesso negado.");
          msg.lang = 'pt-PT';
          msg.volume = 1.0;
          window.speechSynthesis.speak(msg);
        }
      }

      // Mantém a foto no oval e o estado exatamente durante 4 minutos (240000 ms) antes de restaurar o original
      temporizadorReset = setTimeout(() => {
        box.style.borderColor = '#2b8a3e';
        box.innerHTML = `
          <h3 style="color: #2b8a3e;">PRONTO PARA LEITURA</h3>
          <p>Aproxime o cartão de membro ou código de barras</p>
        `;

        // Restaura o logótipo original no espaço oval
        const ovalEl = document.getElementById('totem-oval-content');
        if (ovalEl) {
          ovalEl.outerHTML = `<img src="logo.jpg" alt="KOSMO" id="totem-oval-content" onerror="this.src='src/img/logo.jpg';">`;
        }

        focarLeitor();
      }, 240000);
    }
  </script>
</body>
</html>
