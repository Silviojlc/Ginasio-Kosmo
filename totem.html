<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <style>
    :root { --primary: #c92a2a; --bg: #111417; --card: #1e2227; --success: #2b8a3e; --danger: #d9480f; --text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { width: 100vw; height: 100vh; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px; overflow: hidden; text-align: center; }

    .totem-header { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 600px; }
    .totem-logo { height: 90px; object-fit: contain; background: #fff; border-radius: 8px; padding: 6px; }
    .totem-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
    .totem-clock { font-size: 1.2rem; color: #adb5bd; font-weight: 600; }

    .totem-body { width: 100%; max-width: 650px; background: var(--card); border-radius: 16px; padding: 40px; border: 3px solid #333; box-shadow: 0 15px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .totem-input { width: 100%; padding: 18px 20px; font-size: 1.4rem; font-weight: bold; border-radius: 8px; border: 2px solid #444; background: #fff; color: #212529; text-align: center; outline: none; }
    .totem-input:focus { border-color: var(--primary); }

    .totem-result { width: 100%; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 10px; padding: 20px; background: #262c35; transition: all 0.3s ease; }
    .totem-result.success { background: rgba(43, 138, 62, 0.2); border: 2px solid var(--success); }
    .totem-result.error { background: rgba(217, 72, 15, 0.2); border: 2px solid var(--danger); }
    
    .totem-result h2 { font-size: 1.8rem; margin-bottom: 8px; }
    .totem-result p { font-size: 1.1rem; color: #ced4da; }
    
    .totem-footer { font-size: 0.85rem; color: #6c757d; }
  </style>
</head>
<body>

  <div class="totem-header">
    <img src="logo.jpg" alt="Ginásio KOSMO" class="totem-logo" onerror="this.src='src/img/logo.jpg';">
    <h1>GINÁSIO KOSMO</h1>
    <div id="clock" class="totem-clock">00:00:00</div>
  </div>

  <div class="totem-body">
    <p style="font-size: 1.1rem; color: #adb5bd;">Passe o seu cartão ou digite o código ID:</p>
    <input type="text" id="totem-code-input" class="totem-input" placeholder="A aguardar leitura..." autofocus onkeydown="onTotemScan(event)">
    
    <div id="totem-result-box" class="totem-result">
      <h2>Pronto para Leitura</h2>
      <p>Aproxime o código de barras ou insira o ID no leitor.</p>
    </div>
  </div>

  <div class="totem-footer">
    Terra Branca, Frente Escola Amor De Deus | NIF: 283023805
  </div>

  <script>
    // Relógio em tempo real
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleDateString('pt-PT') + ' - ' + now.toLocaleTimeString('pt-PT');
    }, 1000);

    // Manter foco constante no input para o leitor ótico funcionar sem interrupções
    document.addEventListener('click', () => {
      const inp = document.getElementById('totem-code-input');
      if (inp) inp.focus();
    });

    function onTotemScan(e) {
      if (e.key === 'Enter') {
        const code = document.getElementById('totem-code-input').value.trim();
        if (code) processarCheckinTotem(code);
        document.getElementById('totem-code-input').value = '';
      }
    }

    function processarCheckinTotem(code) {
      let members = JSON.parse(localStorage.getItem('kosmo_members')) || [];
      const m = members.find(x => x.barcode === code);
      const now = new Date();
      const resBox = document.getElementById('totem-result-box');

      if (m) {
        const d = new Date(m.date || '2026-01-01');
        d.setDate(d.getDate() + 30);
        const ativo = d >= now && m.estado === 'Ativo';

        if (ativo) {
          resBox.className = 'totem-result success';
          resBox.innerHTML = `<h2>✅ ACESSO AUTORIZADO</h2><p>Bem-vindo(a), <strong>${m.name}</strong>!</p><p style="margin-top:5px; font-size:0.95rem;">Plano: ${m.plan}</p>`;
        } else {
          resBox.className = 'totem-result error';
          resBox.innerHTML = `<h2>❌ ACESSO NEGADO</h2><p>Subscrição expirada para <strong>${m.name}</strong>.</p><p style="margin-top:5px; font-size:0.95rem;">Por favor, dirija-se à receção.</p>`;
        }

        // Registar também no histórico geral
        let attendanceLogs = JSON.parse(localStorage.getItem('kosmo_attendance')) || [];
        attendanceLogs.unshift({ data: now.toLocaleDateString('pt-PT'), time: now.toLocaleTimeString('pt-PT'), name: m.name, barcode: code, status: ativo ? 'Ativo' : 'Expirado' });
        localStorage.setItem('kosmo_attendance', JSON.stringify(attendanceLogs));

      } else {
        resBox.className = 'totem-result error';
        resBox.innerHTML = `<h2>❌ CARTÃO DESCONHECIDO</h2><p>Código <code>${code}</code> não encontrado no sistema.</p>`;
      }

      // Limpar e focar novamente após 5 segundos
      setTimeout(() => {
        resBox.className = 'totem-result';
        resBox.innerHTML = `<h2>Pronto para Leitura</h2><p>Aproxime o código de barras ou insira o ID no leitor.</p>`;
      }, 5000);
    }
  </script>
</body>
</html>
