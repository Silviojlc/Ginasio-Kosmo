<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Totem Gigante de Check-in</title>
  <style>
    :root { --primary: #c92a2a; --bg: #000000; --success: #2b8a3e; --danger: #d9480f; --text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px 30px; overflow: hidden; }
    
    .totem-top { text-align: center; width: 100%; margin-top: 2px; }
    .totem-data { font-size: 2.5rem; font-weight: 800; text-transform: uppercase; color: #fff; letter-spacing: 2px; margin-bottom: 2px; }
    .totem-relogio { font-size: 7.5rem; font-weight: 900; color: #ffd43b; text-shadow: 0 0 35px rgba(255,212,59,0.6); line-height: 1; }

    .totem-logo-container { width: 100%; display: flex; justify-content: center; align-items: center; margin: 5px 0; }
    .totem-logo-oval { 
      width: 750px; 
      height: 300px; 
      background: #c5d7e6; 
      border-radius: 50%; 
      border: 8px solid var(--primary); 
      box-shadow: 0 0 45px rgba(201, 42, 42, 0.9), inset 0 0 25px rgba(0,0,0,0.15); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
      padding: 15px; 
    }
    .totem-logo-img { width: 100%; height: 100%; object-fit: contain; }

    .totem-action-box { width: 100%; max-width: 750px; text-align: center; margin-bottom: 5px; }
    .totem-form { display: flex; gap: 10px; margin-bottom: 10px; }
    .totem-input-manual { background: #fff; color: #212529; font-size: 1.4rem; font-weight: 800; padding: 10px 20px; border-radius: 8px; border: 4px solid var(--primary); flex: 1; text-align: center; outline: none; }
    .totem-btn-ok { background: var(--success); color: #fff; border: none; padding: 0 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }

    .totem-status-card { background: #161b22; border: 2px solid #333; border-radius: 12px; padding: 12px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-height: 110px; display: flex; align-items: center; justify-content: center; gap: 20px; }
    .status-ok { background: rgba(43, 138, 62, 0.4); color: #51cf66; border: 3px solid var(--success); }
    .status-err { background: rgba(217, 72, 15, 0.4); color: #ff6b6b; border: 3px solid var(--danger); }
    
    .totem-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; background: #333; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #aaa; }

    .totem-footer { font-size: 0.75rem; color: #777; text-align: center; width: 100%; border-top: 1px solid #222; padding-top: 5px; }
  </style>
</head>
<body onclick="focarInput()">

  <div class="totem-top">
    <div class="totem-data" id="data-atual">--</div>
    <div class="totem-relogio" id="relogio">--:--:--</div>
  </div>

  <div class="totem-logo-container">
    <div class="totem-logo-oval">
      <img src="logo.jpg" alt="KOSMO" class="totem-logo-img" onerror="this.src='src/img/logo.jpg';">
    </div>
  </div>

  <div class="totem-action-box">
    <form class="totem-form" onsubmit="event.preventDefault(); executarCheckin();">
      <input type="text" id="totem-barcode-input" class="totem-input-manual" placeholder="PASSE O CARTÃO OU QR CODE..." autocomplete="off" autofocus oninput="detetarLeituraInstantanea(this)">
      <button type="submit" class="totem-btn-ok">OK</button>
    </form>
    
    <div id="totem-resultado" class="totem-status-card">
      <div>
        <h3 style="font-size: 1.4rem; color: #fff; margin-bottom: 2px;">PRONTO PARA LEITURA</h3>
        <p style="font-size: 0.95rem; color: #aaa;">Aproxime o cartão de membro ou código de barras</p>
      </div>
    </div>
  </div>

  <div class="totem-footer">
    Ginásio KOSMO | Terra Branca, Frente Escola Amor De Deus | NIF: 283023805
  </div>

  <script>
    let temporizadorReset = null;

    function atualizarRelogio() {
      const d = new Date();
      const dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
      const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      
      const elData = document.getElementById('data-atual');
      const elRelogio = document.getElementById('relogio');

      if(elData) elData.innerText = `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
      if(elRelogio) elRelogio.innerText = d.toLocaleTimeString('pt-PT');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    const inputLeitor = document.getElementById('totem-barcode-input');

    function focarInput() {
      if (inputLeitor) inputLeitor.focus();
    }
    
    setInterval(focarInput, 150);
    window.onload = focarInput;
    document.body.onclick = focarInput;

    let timeoutInput = null;
    function detetarLeituraInstantanea(el) {
      const valor = el.value.trim();
      if (valor.length >= 3) {
        clearTimeout(timeoutInput);
        timeoutInput = setTimeout(async () => {
          const codigo = el.value.trim();
          el.value = '';
          if (codigo) await processarCheckinTotem(codigo);
        }, 120);
      }
    }

    async function executarCheckin() {
      const codigo = inputLeitor.value.trim();
      if (!codigo) return;
      inputLeitor.value = '';
      await processarCheckinTotem(codigo);
    }

    async function processarCheckinTotem(codigo) {
      if (temporizadorReset) clearTimeout(temporizadorReset);

      const resBox = document.getElementById('totem-resultado');
      resBox.className = "totem-status-card";
      resBox.innerHTML = `<h3 style="font-size: 1.3rem; color: #ffd43b;">A verificar ID: ${codigo}...</h3>`;

      const membrosLocais = JSON.parse(localStorage.getItem('kosmo_members')) || [];
      const membro = membrosLocais.find(m => {
        const b = String(m.barcode || m.id || '').trim();
        return b === String(codigo).trim();
      });

      const now = new Date();

      if (membro) {
        const dataFim = new Date(membro.date || '2026-01-01');
        dataFim.setDate(dataFim.getDate() + 30);
        const ativo = dataFim >= now && ((membro.estado || 'Ativo') === 'Ativo');
        const nomeMembro = membro.name || 'Membro';
        const planoMembro = membro.plan || 'Normal';
        const fotoMembro = membro.foto ? `<img src="${membro.foto}" class="totem-avatar">` : `<div class="totem-avatar">👤</div>`;

        if (ativo) {
          resBox.className = "totem-status-card status-ok";
          resBox.innerHTML = `
            ${fotoMembro}
            <div style="text-align: left;">
              <h3 style="font-size: 1.8rem; margin-bottom: 2px;">✅ ACESSO AUTORIZADO</h3>
              <p style="font-size: 1.3rem; font-weight: bold;">${nomeMembro}</p>
              <p style="font-size: 0.95rem; color: #d4edda;">Plano: ${planoMembro}</p>
            </div>
          `;
        } else {
          resBox.className = "totem-status-card status-err";
          resBox.innerHTML = `
            ${fotoMembro}
            <div style="text-align: left;">
              <h3 style="font-size: 1.8rem; margin-bottom: 2px;">❌ SUBSCRIÇÃO EXPIRADA</h3>
              <p style="font-size: 1.3rem; font-weight: bold;">${nomeMembro}</p>
              <p style="font-size: 0.95rem; color: #f8d7da;">Por favor, renove o plano</p>
            </div>
          `;
        }

        const logs = JSON.parse(localStorage.getItem('kosmo_attendance')) || [];
        logs.unshift({
          data: now.toLocaleDateString('pt-PT'),
          time: now.toLocaleTimeString('pt-PT'),
          name: nomeMembro,
          barcode: codigo,
          status: ativo ? 'Ativo' : 'Expirado',
          foto: membro.foto || ''
        });
        localStorage.setItem('kosmo_attendance', JSON.stringify(logs));

      } else {
        resBox.className = "totem-status-card status-err";
        resBox.innerHTML = `
          <div style="text-align: center;">
            <h3 style="font-size: 1.8rem; margin-bottom: 2px;">❌ CARTÃO DESCONHECIDO</h3>
            <p style="font-size: 1.1rem;">ID "${codigo}" não registado no sistema</p>
          </div>
        `;
      }

      // Ciclo exato de 5 segundos antes de limpar e retornar ao estado inicial
      temporizadorReset = setTimeout(() => {
        resBox.className = "totem-status-card";
        resBox.innerHTML = `
          <div>
            <h3 style="font-size: 1.4rem; color: #fff; margin-bottom: 2px;">PRONTO PARA LEITURA</h3>
            <p style="font-size: 0.95rem; color: #aaa;">Aproxime o cartão de membro ou código de barras</p>
          </div>
        `;
        focarInput();
      }, 5000);
    }
  </script>
</body>
</html>
