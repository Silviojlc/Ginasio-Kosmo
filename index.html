<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginásio KOSMO - Sistema Integrado de Gestão</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root { --primary: #c92a2a; --bg: #f4f6f9; --dark: #212529; --border: #dee2e6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); color: var(--dark); }
    aside { width: 260px; background: #1e2227; color: #c2c7d0; display: flex; flex-direction: column; }
    .gym-header { padding: 20px; text-align: center; background: #14171a; border-bottom: 1px solid #333; }
    .gym-header h3 { color: #fff; font-size: 1.2rem; }
    .menu { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
    .nav-btn { background: transparent; border: none; color: #c2c7d0; padding: 10px 15px; text-align: left; font-size: 0.9rem; cursor: pointer; border-radius: 5px; font-weight: 600; }
    .nav-btn:hover, .nav-btn.active { background: var(--primary); color: #fff; }
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    header { height: 60px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
    main { flex: 1; overflow-y: auto; padding: 25px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
    h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--dark); border-left: 4px solid var(--primary); padding-left: 8px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
    label { font-size: 0.8rem; font-weight: bold; display: block; margin-bottom: 5px; color: #495057; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.9rem; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #a61e1e; }
    .btn-blue { background: #1971c2; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8f9fa; font-weight: 600; }
    .badge-ok { background: #2b8a3e; color: #fff; padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
  </style>
</head>
<body>

  <aside>
    <div class="gym-header">
      <h3>KOSMO GYM</h3>
      <p style="font-size:0.75rem; color:#aaa; margin-top:4px;">NIF: 283023805</p>
    </div>
    <div class="menu">
      <button class="nav-btn active" onclick="switchTab('membros')">👤 Gestão de Membros</button>
      <button class="nav-btn" onclick="switchTab('checkins')">🔔 Check-ins / Totem</button>
    </div>
  </aside>

  <div class="main-content">
    <header>
      <h2 id="page-title" style="border:none; margin:0; padding:0;">Gestão de Membros</h2>
      <button class="btn btn-blue" onclick="openTotemWindow()">🖥 Abrir Ecrã Totem Gigante</button>
    </header>
    <main>
      <!-- TAB MEMBROS -->
      <section id="tab-membros">
        <div class="card">
          <h2>Registar Novo Membro</h2>
          <div class="form-grid">
            <div><label>Nome Completo</label><input type="text" id="m-name" placeholder="Nome do Aluno"></div>
            <div><label>Código / ID (Cartão / Barras)</label><input type="text" id="m-barcode" placeholder="Ex: 123456"></div>
            <div><label>Plano</label><select id="m-plan"><option value="Mensal">Mensal</option><option value="Trimestral">Trimestral</option></select></div>
          </div>
          <button class="btn" onclick="saveMember()">Registar Membro</button>
        </div>
        <div class="card">
          <h2>Lista de Membros Ativos</h2>
          <table>
            <thead><tr><th>Nome</th><th>Código / ID</th><th>Plano</th><th>Estado</th></tr></thead>
            <tbody id="members-tbody"><tr><td colspan="4" style="text-align:center; color:#777;">A carregar membros...</td></tr></tbody>
          </table>
        </div>
      </section>

      <!-- TAB CHECK-INS -->
      <section id="tab-checkins" style="display:none;">
        <div class="card">
          <h2>Terminal de Check-ins (Leitor de Cartão / Barras)</h2>
          <input type="text" id="chk-input" placeholder="Passe o cartão ou digite o ID e prima Enter..." onkeydown="onScan(event)" style="padding:12px; font-weight:bold; font-size:1.1rem; width:100%; margin-bottom:15px;">
          <table>
            <thead><tr><th>Data</th><th>Hora</th><th>Membro</th><th>Código</th><th>Estado</th></tr></thead>
            <tbody id="attendance-tbody"><tr><td colspan="5" style="text-align:center; color:#777;">Sem check-ins registados hoje.</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    let members = JSON.parse(localStorage.getItem('kosmo_members')) || [
      { name: 'Silvio Cabral', barcode: '112233', plan: 'Mensal', estado: 'Ativo' }
    ];
    let attendanceLogs = JSON.parse(localStorage.getItem('kosmo_attendance')) || [];

    function switchTab(tab) {
      document.getElementById('tab-membros').style.display = tab === 'membros' ? 'block' : 'none';
      document.getElementById('tab-checkins').style.display = tab === 'checkins' ? 'block' : 'none';
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('page-title').innerText = tab === 'membros' ? 'Gestão de Membros' : 'Check-ins / Totem';
      if (tab === 'membros') renderMembers();
      if (tab === 'checkins') renderAttendance();
    }

    function openTotemWindow() {
      window.open('totem.html', '_blank', 'width=1100,height=800');
    }

    function saveMember() {
      const name = document.getElementById('m-name').value.trim();
      const barcode = document.getElementById('m-barcode').value.trim();
      const plan = document.getElementById('m-plan').value;
      if (!name || !barcode) { alert('Preencha todos os campos obrigatórios.'); return; }
      members.push({ name, barcode, plan, estado: 'Ativo' });
      localStorage.setItem('kosmo_members', JSON.stringify(members));
      alert('Membro registado com sucesso!');
      document.getElementById('m-name').value = '';
      document.getElementById('m-barcode').value = '';
      renderMembers();
    }

    function renderMembers() {
      const tbody = document.getElementById('members-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';
      members.forEach(m => {
        tbody.innerHTML += `<tr><td><strong>${m.name}</strong></td><td><code>${m.barcode}</code></td><td>${m.plan}</td><td><span class="badge-ok">${m.estado}</span></td></tr>`;
      });
    }

    function onScan(e) {
      if (e.key === 'Enter') {
        const code = document.getElementById('chk-input').value.trim();
        if (!code) return;
        const m = members.find(x => x.barcode === code) || { name: 'Membro (Convidado)', plan: 'Geral', barcode: code };
        const now = new Date();
        const log = { data: now.toLocaleDateString('pt-PT'), time: now.toLocaleTimeString('pt-PT'), name: m.name, barcode: m.barcode, status: 'Ativo' };
        
        attendanceLogs.unshift(log);
        localStorage.setItem('kosmo_attendance', JSON.stringify(attendanceLogs));
        renderAttendance();

        // Envia os dados para a janela do Totem em tempo real
        localStorage.setItem('kosmo_totem_scan', JSON.stringify({ name: m.name, plan: m.plan, auth: true, time: Date.now() }));
        document.getElementById('chk-input').value = '';
      }
    }

    function renderAttendance() {
      const tbody = document.getElementById('attendance-tbody');
      if (!tbody) return;
      if (attendanceLogs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#777;">Sem check-ins registados hoje.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      attendanceLogs.forEach(a => {
        tbody.innerHTML += `<tr><td>${a.data}</td><td>${a.time}</td><td><strong>${a.name}</strong></td><td><code>${a.barcode}</code></td><td><span class="badge-ok">Ativo</span></td></tr>`;
      });
    }

    window.onload = () => { renderMembers(); renderAttendance(); };
  </script>
</body>
</html>
